<article class="rh-shared-product-card rh-no-section-label" [class.rh-compact-mobile]="compactMobile" [class.rh-shared-product-list]="viewMode === 'list'" [class.is-out-of-stock]="!product.inStock" [class.has-variant-options]="variantOptionsOpen()">
  <div class="rh-shared-card-top">
    <span *ngIf="!product.inStock" class="rh-shared-stock-tag">Out of stock</span>
    <button *ngIf="product.inStock || (allowRemovingUnavailableFavorite && favorite())" type="button" class="rh-shared-favorite" [class.active]="favorite()" [attr.aria-pressed]="favorite()" [attr.aria-label]="(favorite() ? 'Remove ' : 'Add ') + product.title + ' from favorites'" (click)="toggleFavorite($event)"><i class="fal fa-heart" aria-hidden="true"></i></button>
    <ng-container *ngIf="product.inStock"><span *ngIf="showTopSellingBadge" class="rh-shared-discount-badge rh-top-selling-badge">Top Selling</span><span *ngIf="!showTopSellingBadge && displayDiscountPercent as discount" class="rh-shared-discount-badge">{{ discount }}% OFF</span></ng-container>
  </div>

  <a [routerLink]="['/products', product.id]" class="rh-shared-product-image" [attr.aria-label]="'View ' + product.title">
    <img [src]="product.image" [alt]="product.title" loading="lazy" decoding="async">
  </a>

  <div class="rh-shared-product-copy">
    <h3><a [routerLink]="['/products', product.id]">{{ product.title }}</a></h3>
    <div class="rh-shared-price-row">
      <div class="rh-shared-price-wrap">
        <strong>Rs. {{ displayPrice | number:'1.0-0' }}</strong>
        <del *ngIf="displayOldPrice">Rs. {{ displayOldPrice | number:'1.0-0' }}</del>
      </div>

      <div class="rh-shared-variant-select" *ngIf="product.variants && product.variants.length > 1">
        <button type="button" class="rh-variant-select-trigger" aria-haspopup="dialog" [attr.aria-expanded]="variantOptionsOpen()" [attr.aria-label]="'Choose size for ' + product.title" (click)="toggleVariantOptions($event)">
          <span>{{ selectedVariant?.label || 'Choose size' }}</span><i class="fal fa-chevron-down" aria-hidden="true"></i>
        </button>
        <dialog class="rh-variant-dialog" [attr.aria-label]="'Choose size for ' + product.title" (close)="onVariantDialogClosed()" (cancel)="onVariantDialogClosed()" (click)="closeVariantBackdrop($event)">
          <header class="rh-variant-dialog-header"><span><i class="fal fa-tag" aria-hidden="true"></i> Choose size</span><button type="button" class="rh-variant-close" aria-label="Close" (click)="closeVariantDialog()"><i class="fal fa-times" aria-hidden="true"></i></button></header>
          <div class="rh-variant-dialog-body"><p>{{ product.title }}</p><div role="listbox" [attr.aria-label]="'Available sizes for ' + product.title">
          <button *ngFor="let variant of product.variants" type="button" class="rh-variant-option" [class.is-selected]="selectedVariantId() === variant.id" [attr.aria-selected]="selectedVariantId() === variant.id" role="option" (click)="selectVariant($event, variant.id)">
            <span class="rh-variant-option-copy"><strong>{{ variant.label }}</strong></span>
            <span class="rh-variant-option-price">Rs. {{ variant.price | number:'1.0-0' }}</span>
            <i *ngIf="selectedVariantId() === variant.id" class="fal fa-check" aria-hidden="true"></i>
          </button>
          </div></div>
        </dialog>
      </div>
    </div>
    <button *ngIf="!product.inStock" 
            type="button" 
            class="rh-shared-add-button rh-btn-alternate" 
            (click)="openAlternateModal($event)" 
            title="Select replacement option">
      <ng-container *ngIf="alternateModalService.getSelection(product.id) as sel; else noSelection">
        <i class="fal fa-check" aria-hidden="true"></i>
        <span class="rh-alt-btn-text">{{ sel.type === 'alternate' ? 'Alternate Selected' : 'Best Match Selected' }}</span>
      </ng-container>
      <ng-template #noSelection>
        <i class="fal fa-exchange-alt me-1" aria-hidden="true"></i> ALTERNATE
      </ng-template>
    </button>
    <button *ngIf="product.inStock && cartQuantity === 0; else cartQuantityControl" type="button" class="rh-shared-add-button" (click)="addToCart($event)"><i class="fal fa-shopping-bag" aria-hidden="true"></i> ADD</button>
    <ng-template #cartQuantityControl>
      <div *ngIf="product.inStock" class="rh-shared-quantity" [attr.aria-label]="'Quantity of ' + product.title + ' in cart'">
        <button type="button" (click)="changeQuantity($event, -1)" [attr.aria-label]="'Remove one ' + product.title">−</button>
        <span aria-live="polite">{{ cartQuantity }}</span>
        <button type="button" (click)="changeQuantity($event, 1)" [attr.aria-label]="'Add one ' + product.title">+</button>
      </div>
    </ng-template>
  </div>
</article>
