<section class="assistant-page" aria-labelledby="assistant-title">
  <header class="assistant-header"><h2 id="assistant-title">Rainbow Assistant</h2></header>
  <div class="assistant-content">
    <div class="assistant-welcome">
      <div class="assistant-mark" aria-hidden="true"><img src="assets/images/logo/rainbow-mark.svg" alt=""></div>
      <p>Hello, {{ firstName }}</p>
      <h3>How can we help today?</h3>
    </div>
    <div *ngIf="messages().length" class="assistant-history" aria-live="polite" aria-label="Questions and answers">
      <div *ngFor="let message of messages()" class="assistant-message" [class.is-customer]="message.from === 'customer'">
        <span class="assistant-message-label">{{ message.from === 'customer' ? 'You' : 'Rainbow Assistant' }}</span>
        <p>{{ message.text }}</p>
        <a *ngIf="message.link" [routerLink]="message.link">{{ message.linkText }} <i class="fal fa-arrow-right" aria-hidden="true"></i></a>
        <button *ngIf="message.showOrders" type="button" class="assistant-inline-link" (click)="viewOrders.emit()">View order history <i class="fal fa-arrow-right" aria-hidden="true"></i></button>
        <div *ngIf="message.showContactDetails" class="assistant-contact"><a href="tel:+923107779651">+92 310 7779651</a><a href="mailto:online&#64;rainbowcc.com.pk">online&#64;rainbowcc.com.pk</a></div>
      </div>
    </div>
    <form class="assistant-compose" (ngSubmit)="send(draft)">
      <label for="assistant-question" class="assistant-visually-hidden">Ask Rainbow Assistant</label>
      <textarea id="assistant-question" name="message" [(ngModel)]="draft" rows="2" placeholder="Ask me about your order or shopping..."></textarea>
      <div class="assistant-compose-footer"><span class="assistant-compose-brand"><img src="assets/images/logo/rainbow-mark.svg" alt=""> Rainbow Assistant</span><button type="submit" [disabled]="!draft.trim()" aria-label="Send message"><i class="fal fa-arrow-right" aria-hidden="true"></i></button></div>
    </form>
    <div class="assistant-suggestions" aria-label="Suggested questions">
      <button type="button" (click)="send('Track my order')"><span class="assistant-suggestion-icon"><i class="fal fa-box" aria-hidden="true"></i></span><strong>Track my order</strong></button>
      <button type="button" (click)="send('How do I place an order?')"><span class="assistant-suggestion-icon assistant-icon-shop"><i class="fal fa-shopping-bag" aria-hidden="true"></i></span><strong>Place an order</strong></button>
      <button type="button" (click)="send('Other questions')"><span class="assistant-suggestion-icon assistant-icon-help"><i class="fal fa-headset" aria-hidden="true"></i></span><strong>Other questions</strong></button>
    </div>
  </div>
</section>
