<div class="sidebar-menu-wrapper">
  <div class="sidebar_mobile_menu" [class.active]="isOpen">
    <button type="button" class="close_btn" (click)="onClose()"><i class="fal fa-times"></i></button>

    <div class="msb_widget brand_logo text-center">
      <a routerLink="/" (click)="onClose()">
        <img src="assets/images/logo/RainbowLogo.png" srcset="assets/images/logo/RainbowLogo.png 2x" alt="Rainbow Cash &amp; Carry">
      </a>
    </div>

    <div class="msb_widget mobile_menu_list clearfix">
      <h3 class="title_text mb_15 text-uppercase"><i class="far fa-bars me-2"></i> Menu List</h3>
      <ul class="ul_li_block clearfix">
        <li><a routerLink="/" (click)="onClose()">Home</a></li>
        <li><a routerLink="/shop" (click)="onClose()">Shop</a></li>
        <li><a routerLink="/about" (click)="onClose()">About Us</a></li>
        <li><a routerLink="/contact" (click)="onClose()">Contact Us</a></li>
      </ul>
    </div>

    <div class="user_info">
      <h3 class="title_text mb_30 text-uppercase"><i class="fas fa-user me-2"></i> User Info</h3>
      <div class="profile_info clearfix">
        <div class="user_thumbnail">
          <img src="assets/images/meta/img_01.jpg" alt="User">
        </div>
        <div class="user_content">
          <h4 class="user_name">Customer Account</h4>
        </div>
      </div>
      <ul class="settings_options ul_li_block clearfix">
        <li><a routerLink="/login" (click)="onClose()"><i class="fal fa-user-circle me-2"></i> Profile / Login</a></li>
        <li><a routerLink="/signup" (click)="onClose()"><i class="fal fa-user-plus me-2"></i> Register</a></li>
      </ul>
    </div>
  </div>

  <div class="overlay" [class.active]="isOpen" (click)="onClose()"></div>
</div>
