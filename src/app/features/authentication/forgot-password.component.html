<app-otp-dialog *ngIf="otpOpen" mode="password" (close)="otpOpen = false"></app-otp-dialog>
<section class="rh-auth-page">
  <div class="rh-auth-card">
    <div class="rh-auth-card-header">
      <img src="assets/images/logo/RainbowLogo.png" alt="Rainbow Cash &amp; Carry" class="rh-auth-card-logo">
      <h2>Forgot your password?</h2>
    </div>

    <form *ngIf="!submitted" #resetForm="ngForm" class="rh-auth-form" (ngSubmit)="submit(resetForm)" novalidate>
      <label class="rh-auth-field">
        <span>Email address</span>
        <span class="rh-auth-input-wrap">
          <i class="fal fa-envelope" aria-hidden="true"></i>
          <input type="email" name="email" [(ngModel)]="email" #emailField="ngModel" placeholder="Enter your email address" autocomplete="email" required email [attr.aria-invalid]="emailField.invalid && emailField.touched ? 'true' : null" aria-describedby="reset-email-error">
        </span>
      </label>
      <p id="reset-email-error" class="forgot-error" *ngIf="emailField.invalid && emailField.touched" role="alert">Please enter a valid email address.</p>
      <button type="submit" class="rh-auth-submit"><span>Continue</span><i class="fal fa-arrow-right" aria-hidden="true"></i></button>
    </form>

    <div *ngIf="submitted" class="forgot-notice" role="status">
      <i class="fal fa-info-circle" aria-hidden="true"></i>
      <div><strong>Try the demo password reset</strong><p>No email or SMS is sent, and your account password will not be changed.</p><button type="button" class="forgot-verify" (click)="otpOpen = true">Verify by mobile</button> <a routerLink="/contact" class="rh-auth-link-primary">Contact customer service</a></div>
    </div>

    <div class="rh-auth-card-footer forgot-footer">
      <a routerLink="/login" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}" class="rh-auth-link-bold"><i class="fal fa-arrow-left" aria-hidden="true"></i> Back to login</a>
    </div>
  </div>
  <p class="rh-auth-copyright">&copy; {{ currentYear }} Rainbow Cash &amp; Carry. All rights reserved.</p>
</section>
