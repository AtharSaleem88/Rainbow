<section class="rh-auth-page">
  <div class="rh-auth-topbar">
    <a class="rh-auth-back" routerLink="/" aria-label="Back to Rainbow home">
      <i class="fal fa-arrow-left" aria-hidden="true"></i>
      <span>Back to shopping</span>
    </a>
  </div>

  <div class="rh-auth-card">
    <div class="rh-auth-card-header">
      <img src="assets/images/logo/RainbowLogo.png" alt="Rainbow Cash &amp; Carry" class="rh-auth-card-logo">
      <h2>Create your account</h2>
      <p class="rh-auth-card-sub">Welcome! Join Rainbow Cash &amp; Carry in a few simple steps</p>
    </div>

    <form class="rh-auth-form" (ngSubmit)="onSignup()">
      <label class="rh-auth-field">
        <span>Full name</span>
        <span class="rh-auth-input-wrap">
          <i class="fal fa-user" aria-hidden="true"></i>
          <input type="text" name="fullname" [(ngModel)]="userData.fullName" placeholder="Enter your full name" autocomplete="name" required>
        </span>
      </label>

      <label class="rh-auth-field">
        <span>Email address</span>
        <span class="rh-auth-input-wrap">
          <i class="fal fa-envelope" aria-hidden="true"></i>
          <input type="email" name="email" [(ngModel)]="userData.email" placeholder="you@example.com" autocomplete="email" required>
        </span>
      </label>

      <label class="rh-auth-field">
        <span>Phone number</span>
        <span class="rh-auth-input-wrap">
          <i class="fal fa-phone" aria-hidden="true"></i>
          <input type="tel" name="phone" [(ngModel)]="userData.phone" placeholder="03XX XXXXXXX" autocomplete="tel" inputmode="tel" required>
        </span>
      </label>

      <label class="rh-auth-field">
        <span>Password</span>
        <span class="rh-auth-input-wrap">
          <i class="fal fa-lock" aria-hidden="true"></i>
          <input [type]="passwordVisible ? 'text' : 'password'" name="password" [(ngModel)]="userData.password" placeholder="Create a strong password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="rh-auth-password-toggle" (click)="togglePassword()" [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'">
            <i class="fal" [ngClass]="passwordVisible ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
          </button>
        </span>
      </label>

      <label class="rh-auth-check rh-auth-terms">
        <input type="checkbox" name="agree" required>
        <span>I agree to Rainbow's <a routerLink="/about">Terms of Use</a> and <a routerLink="/about">Privacy Policy</a>.</span>
      </label>

      <button type="submit" class="rh-auth-submit">
        <span>Create account</span>
        <i class="fal fa-arrow-right" aria-hidden="true"></i>
      </button>
    </form>

    <div class="rh-auth-card-footer">
      <p class="rh-auth-footer-text">Already have an account? <a routerLink="/login" class="rh-auth-link-bold">Sign in</a></p>
      <div class="rh-auth-support">
        <span class="rh-auth-support-lbl">Need Support?</span>
        <a routerLink="/contact" class="rh-auth-link-primary">Contact customer service</a>
      </div>
    </div>
  </div>

  <p class="rh-auth-copyright">&copy; {{ currentYear }} Rainbow Cash &amp; Carry. All rights reserved.</p>
</section>
