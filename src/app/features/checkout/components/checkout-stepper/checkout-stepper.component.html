<nav class="rainbow-checkout-stepper" aria-label="Checkout Progress">
  <div class="rainbow-step" [class.is-active]="currentStep === 1" [class.is-completed]="currentStep > 1" (click)="onStepClick(1)">
    <span class="rainbow-step-num">
      <i *ngIf="currentStep > 1" class="fal fa-check"></i>
      <span *ngIf="currentStep <= 1">1</span>
    </span>
    <div class="rainbow-step-text">
      <strong class="d-none d-sm-inline">Shipping & Delivery</strong>
      <strong class="d-sm-none">Shipping</strong>
      <small>Address details</small>
    </div>
  </div>

  <div class="rainbow-step-line" [class.is-active]="currentStep >= 2"></div>

  <div class="rainbow-step" [class.is-active]="currentStep === 2" [class.is-completed]="currentStep > 2" (click)="currentStep > 1 ? onStepClick(2) : null">
    <span class="rainbow-step-num">
      <i *ngIf="currentStep > 2" class="fal fa-check"></i>
      <span *ngIf="currentStep <= 2">2</span>
    </span>
    <div class="rainbow-step-text">
      <strong class="d-none d-sm-inline">Review & Payment</strong>
      <strong class="d-sm-none">Payment</strong>
      <small>Payment method</small>
    </div>
  </div>

  <div class="rainbow-step-line" [class.is-active]="currentStep === 3"></div>

  <div class="rainbow-step" [class.is-active]="currentStep === 3">
    <span class="rainbow-step-num">3</span>
    <div class="rainbow-step-text">
      <strong class="d-none d-sm-inline">Order Placed</strong>
      <strong class="d-sm-none">Placed</strong>
      <small>Confirmation</small>
    </div>
  </div>
</nav>
