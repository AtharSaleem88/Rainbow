<!-- Rainbow Hero Banner Slider -->
<app-hero-slider [slides]="heroSlides"></app-hero-slider>

<!-- Shop by Category -->
<app-category-grid [categories]="categories"></app-category-grid>

<!-- Category Spotlights -->
<app-category-spotlights [spotlights]="spotlightCategories"></app-category-spotlights>

<!-- Monthly Deals & Savings Flyer -->
<app-monthly-deals [dealData]="monthlyDeal" [products]="allProducts"></app-monthly-deals>

<!-- Fresh From Farm Collection -->
<app-product-collection-rail
  title="Fresh From Farm"
  titleLead="FRESH FROM"
  titleAccent="FARM"
  [products]="farmProducts"
  sectionLabel="Fresh From Farm"
  seeAllLink="/shop"
  [seeAllQueryParams]="{ category: 'ultra-fresh' }">
</app-product-collection-rail>

<!-- Rainbow Finds Collection -->
<app-product-collection-rail
  title="Rainbow Finds"
  titleLead="RAINBOW"
  titleAccent="FINDS"
  [products]="rainbowFinds"
  sectionLabel="Rainbow Finds"
  [isTinted]="true"
  seeAllLink="/shop"
  [seeAllQueryParams]="{ category: 'grocery' }">
</app-product-collection-rail>

<!-- Frozen Food Section -->
<app-product-collection-rail
  title="Frozen Food Section"
  titleLead="FROZEN FOOD"
  titleAccent="SECTION"
  [products]="frozenProducts"
  sectionLabel="Frozen Food Section"
  seeAllLink="/shop"
  [seeAllQueryParams]="{ category: 'frozen-food' }">
</app-product-collection-rail>

<!-- Promotional Category Banners -->
<app-promo-banners></app-promo-banners>

<!-- Brands You Trust Infinite Ticker & Brand Store Modal -->
<app-brand-showcase [brands]="brands" [products]="allProducts"></app-brand-showcase>

<!-- Price Drops Collection -->
<app-product-collection-rail
  title="Price Drops"
  titleLead="PRICE"
  titleAccent="DROPS"
  subtitle="EXCLUSIVE DEALS AND PRICE REDUCTIONS ON EVERYDAY ESSENTIALS."
  [products]="priceDropProducts"
  sectionLabel="Price Drop"
  [isTinted]="true"
  seeAllLink="/shop">
</app-product-collection-rail>

<!-- Campaign Showcase Slider -->
<app-campaign-slider [banners]="campaignBanners"></app-campaign-slider>

<!-- Store Trust Factors Policy Section -->
<app-store-policy></app-store-policy>

<!-- Floating Quick Actions (Top Scroller & WhatsApp) -->
<app-floating-actions></app-floating-actions>
