<section
  class="rh-product-collection"
  [class.rh-product-collection-tint]="isTinted"
  [attr.aria-labelledby]="sectionId">
  <div class="container maxw_1460">
    <header class="rh-collection-heading-centered">
      <div class="rh-collection-title-row">
        <h2 [id]="sectionId">
          <ng-container *ngIf="titleLead && titleAccent; else plainTitle">
            <span class="rh-collection-title-dark">{{ titleLead }}</span>
            <span class="rh-collection-title-blue">{{ titleAccent }}</span>
          </ng-container>
          <ng-template #plainTitle>{{ title }}</ng-template>
        </h2>
        <div class="gray_line" aria-hidden="true"></div>
        <a *ngIf="seeAllLink" [routerLink]="seeAllLink" [queryParams]="seeAllQueryParams" class="rh-collection-see-all">
          {{ seeAllText }} <i class="fal fa-arrow-right" aria-hidden="true"></i>
        </a>
      </div>
    </header>
    <div class="rh-product-rail" [attr.aria-label]="title + ' products'">
      <a *ngIf="showRainbowCard" class="rh-rainbow-promo" [routerLink]="seeAllLink" [queryParams]="seeAllQueryParams" aria-label="Explore Rainbow Finds">
        <img src="assets/images/logo/RainbowLogo.png" alt="Rainbow" class="rh-rainbow-promo-logo">
        <div class="rh-rainbow-promo-copy"><span>EVERYDAY FINDS</span><strong>A little more<br>to discover.</strong><small>Fresh finds. Great value.</small></div>
        <div class="rh-rainbow-promo-art" aria-hidden="true"><i class="fal fa-shopping-basket"></i><i class="fal fa-apple-alt"></i><i class="fal fa-leaf"></i></div>
      </a>
      <app-product-card
        *ngFor="let product of products"
        [product]="product"
        [sectionLabel]="sectionLabel">
      </app-product-card>
    </div>
  </div>
</section>
