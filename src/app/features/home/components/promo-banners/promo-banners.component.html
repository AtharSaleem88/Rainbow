<section class="rh-promo-banners" aria-label="Explore more at Rainbow">
  <div class="container maxw_1460">
    <div class="rh-promo-banner-grid">
      <a routerLink="/shop" [queryParams]="{ category: 'grocery' }" class="rh-promo-banner rh-promo-grocery">
        <img
          class="rh-promo-banner-image"
          src="assets/images/home/pakistan-grocery-banner.png"
          alt="Pakistani pantry staples, rice, lentils, spices and freshly prepared biryani"
          loading="lazy"
          decoding="async">
        <span class="rh-promo-banner-shade" aria-hidden="true"></span>
        <span class="rh-promo-banner-copy">
          <span class="rh-promo-banner-eyebrow">PAKISTANI PANTRY</span>
          <strong class="rh-promo-banner-title">Grocery, close to home</strong>
          <span class="rh-promo-banner-description">Everyday staples and flavours loved across Pakistan.</span>
          <span class="rh-promo-banner-cta">Shop grocery <i class="fal fa-arrow-right" aria-hidden="true"></i></span>
        </span>
      </a>

      <a routerLink="/shop" [queryParams]="{ category: 'personal-care' }" class="rh-promo-banner rh-promo-beauty">
        <img
          class="rh-promo-banner-image"
          src="assets/images/home/pakistan-health-beauty-banner.png"
          alt="Skincare, beauty and personal care products for everyday routines"
          loading="lazy"
          decoding="async">
        <span class="rh-promo-banner-shade" aria-hidden="true"></span>
        <span class="rh-promo-banner-copy">
          <span class="rh-promo-banner-eyebrow">HEALTH &amp; BEAUTY</span>
          <strong class="rh-promo-banner-title">Care for every day</strong>
          <span class="rh-promo-banner-description">Beauty and personal care favourites found in Pakistan.</span>
          <span class="rh-promo-banner-cta">Shop the collection <i class="fal fa-arrow-right" aria-hidden="true"></i></span>
        </span>
      </a>
    </div>
  </div>
</section>
