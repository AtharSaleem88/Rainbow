<section class="rh-promo-banners" aria-label="Explore more at Rainbow">
  <div class="container maxw_1460">
    <div class="rh-promo-banner-grid">
      <a routerLink="/shop" [queryParams]="{ category: 'personal-care' }" class="rh-promo-banner rh-promo-health">
        <img
          class="rh-promo-banner-image"
          src="assets/images/rainbow-health-beauty-banner.png"
          alt="Premium skincare and personal care products"
          loading="lazy"
          decoding="async">
        <span class="rh-promo-banner-shade" aria-hidden="true"></span>
        <span class="rh-promo-banner-copy">
          <strong class="rh-promo-banner-title">Health &amp; Beauty</strong>
          <span class="rh-promo-banner-description">Little care, lasting confidence.</span>
          <span class="rh-promo-banner-cta">See the Collection <i class="fal fa-arrow-right" aria-hidden="true"></i></span>
        </span>
      </a>

      <a routerLink="/shop" [queryParams]="{ category: 'home-office' }" class="rh-promo-banner rh-promo-electronics">
        <img
          class="rh-promo-banner-image"
          src="assets/images/rainbow-electronics-banner.png"
          alt="Modern everyday electronics including headphones, a phone, and a smartwatch"
          loading="lazy"
          decoding="async">
        <span class="rh-promo-banner-shade" aria-hidden="true"></span>
        <span class="rh-promo-banner-copy">
          <strong class="rh-promo-banner-title">Electronics &amp; Gadgets</strong>
          <span class="rh-promo-banner-cta">See Smart Products <i class="fal fa-arrow-right" aria-hidden="true"></i></span>
        </span>
      </a>
    </div>
  </div>
</section>
