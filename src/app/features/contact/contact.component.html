<!-- breadcrumb_section - start -->
<section class="breadcrumb_section text-white text-center text-uppercase d-flex align-items-end clearfix"
  style="background-image: url('assets/images/breadcrumb/contact.jpg'); background-size: cover; padding: 60px 0; position: relative;">
  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #2e3192; opacity: 0.85; z-index: 1;"></div>
  <div class="container" style="position: relative; z-index: 2;">
    <h1 class="page_title text-white">Contact Us</h1>
    <ul class="breadcrumb_nav ul_li_center clearfix text-white">
      <li><a routerLink="/" class="text-white">Home</a></li>
      <li>Contact Us</li>
    </ul>
  </div>
</section>
<!-- breadcrumb_section - end -->

<!-- main_contact_section - start -->
<section class="main_contact_section sec_ptb_100 clearfix pg-visible" id="pg-content">
  <div class="container">
    <div class="row justify-content-lg-between">
      <div class="col-lg-5">
        <div class="main_contact_content">
          <h3 class="title_text mb_15">Get In Touch</h3>
          <ul class="main_contact_info ul_li_block clearfix">
            <li>
              <span class="icon">
                <i class="fal fa-map-marked-alt"></i>
              </span>
              <p class="mb-0">
                Bahria Town, CC-Block Cc Block Sector D, Bahria Town, Lahore
              </p>
            </li>
            <li>
              <span class="icon">
                <i class="fal fa-phone-volume"></i>
              </span>
              <p class="mb-0"> +923107779651</p>
            </li>
            <li>
              <span class="icon">
                <i class="fal fa-paper-plane"></i>
              </span>
              <p class="mb-0">online&#64;rainbowcc.com.pk</p>
            </li>
          </ul>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="main_contact_form">
          <h3 class="title_text mb_30">FeedBack</h3>
          <form (submit)="onSubmit(); $event.preventDefault();">
            <div class="row">
              <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="form_item">
                  <input type="text" name="name" [(ngModel)]="formData.name" placeholder="Your Name" required>
                </div>
              </div>

              <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="form_item">
                  <input type="email" name="email" [(ngModel)]="formData.email" placeholder="Your Email" required>
                </div>
              </div>

              <div class="col-lg-4 col-md-12 col-sm-12">
                <div class="form_item">
                  <input type="text" name="subject" [(ngModel)]="formData.subject" placeholder="Subject" required>
                </div>
              </div>
            </div>

            <div class="form_item">
              <textarea name="message" [(ngModel)]="formData.message" placeholder="Your Message" required></textarea>
            </div>
            <button type="submit" class="custom_btn bg_default_red text-uppercase">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- main_contact_section - end -->
