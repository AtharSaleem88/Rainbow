<div class="rh-shop-header-filters">
  <div class="rh-filter-controls-row">
    <!-- Brand Dropdown -->
    <div class="rh-filter-field rh-brand-filter" #brandFilter>
      <span class="rh-filter-label">Brand</span>
      <div class="rh-filter-dropdown">
        <button
          id="rh-shop-brand-select"
          type="button"
          class="rh-filter-select rh-filter-dropdown-trigger"
          [attr.aria-expanded]="brandMenuOpen"
          [attr.aria-label]="'Filter by brand, ' + (selectedBrand || 'All brands')"
          aria-controls="rh-shop-brand-options"
          aria-haspopup="true"
          (click)="toggleBrandMenu()">
          <span>{{ selectedBrand || 'All brands' }}</span>
          <i class="fal fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div *ngIf="brandMenuOpen" id="rh-shop-brand-options" class="rh-filter-dropdown-menu" role="group" aria-label="Choose a brand">
          <button
            *ngFor="let brand of brandOptions"
            type="button"
            class="rh-filter-dropdown-option"
            [class.is-selected]="selectedBrand === brand.value"
            [attr.aria-pressed]="selectedBrand === brand.value"
            (click)="selectBrand(brand.value)">
            <span>{{ brand.label }}</span>
            <i *ngIf="selectedBrand === brand.value" class="fal fa-check" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Price Filter (Min & Max Price inputs) -->
    <div class="rh-filter-field">
      <span class="rh-filter-label">Price (Rs.)</span>
      <div class="rh-price-range-group">
        <input
          type="number"
          min="0"
          placeholder="Min"
          class="rh-filter-input"
          [value]="minPrice"
          (input)="onMinPriceChange($event)"
          aria-label="Minimum price">
        <span class="rh-price-dash">-</span>
        <input
          type="number"
          min="0"
          placeholder="Max"
          class="rh-filter-input"
          [value]="maxPrice"
          (input)="onMaxPriceChange($event)"
          aria-label="Maximum price">
      </div>
    </div>

    <!-- Sort By Dropdown -->
    <div class="rh-filter-field ms-auto" #sortFilter>
      <span class="rh-filter-label">Sort By</span>
      <div class="rh-filter-dropdown rh-sort-dropdown">
        <button
          id="rh-shop-sort-select"
          type="button"
          class="rh-filter-select rh-filter-dropdown-trigger"
          [attr.aria-expanded]="sortMenuOpen"
          [attr.aria-label]="'Sort products, ' + selectedSortLabel"
          aria-controls="rh-shop-sort-options"
          aria-haspopup="true"
          (click)="toggleSortMenu()">
          <span>{{ selectedSortLabel }}</span>
          <i class="fal fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div *ngIf="sortMenuOpen" id="rh-shop-sort-options" class="rh-filter-dropdown-menu" role="group" aria-label="Choose sort order">
          <button
            *ngFor="let sort of sortOptions"
            type="button"
            class="rh-filter-dropdown-option"
            [class.is-selected]="selectedSort === sort.value"
            [attr.aria-pressed]="selectedSort === sort.value"
            (click)="selectSort(sort.value)">
            <span>{{ sort.label }}</span>
            <i *ngIf="selectedSort === sort.value" class="fal fa-check" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="rh-filter-divider"></div>

  <!-- Sub Sub Categories Horizontal Filter Chips -->
  <div class="rh-subsub-row">
    <div class="rh-subsub-chips-container" role="group" aria-label="Subcategory filters">
      <button
        type="button"
        class="rh-subsub-chip"
        [class.active]="!selectedSubSubCategory"
        (click)="selectSubSubCategory('')">
        All
      </button>
      <button
        *ngFor="let subSubCat of subSubCategories"
        type="button"
        class="rh-subsub-chip"
        [class.active]="selectedSubSubCategory === subSubCat"
        (click)="selectSubSubCategory(subSubCat)">
        {{ subSubCat }}
      </button>
    </div>
  </div>
</div>
