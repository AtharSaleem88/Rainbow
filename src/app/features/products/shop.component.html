<section class="rh-shop-intro">
  <div class="container maxw_1460">
    <app-breadcrumbs [items]="breadcrumbs"></app-breadcrumbs>
  </div>
</section>

<section class="rh-shop-section">
  <div class="container maxw_1460">
    <div class="rh-shop-layout">
      <!-- 1. VERTICAL SUBCATEGORIES SIDEBAR -->
      <app-subcat-sidebar
        [items]="subCategoryItems()"
        [selectedSubCategory]="selectedSubCategory()"
        (subCategorySelected)="onSubCategorySelect($event)">
      </app-subcat-sidebar>

      <!-- 2. MAIN RESULTS AREA -->
      <main class="rh-shop-results flex-grow-1">
        <!-- Header Filters Bar -->
        <app-shop-filters
          [selectedBrand]="selectedBrand()"
          [minPrice]="minPrice()"
          [maxPrice]="maxPrice()"
          [selectedSort]="selectedSort()"
          [subSubCategories]="subSubCategories"
          [selectedSubSubCategory]="selectedSubSubCategory()"
          (brandChanged)="onBrandChange($event)"
          (minPriceChanged)="onMinPriceChange($event)"
          (maxPriceChanged)="onMaxPriceChange($event)"
          (sortChanged)="onSortChangeValue($event)"
          (subSubCategoryChanged)="onSubSubCategoryChange($event)">
        </app-shop-filters>

        <!-- Products Count & Title -->
        <div class="d-flex align-items-center justify-content-between mb-2 px-1">
          <h2 class="h5 mb-0 font-Poppins fw-bold text-primary">{{ subCategoryDisplayName }}</h2>
          <small class="text-muted">Showing {{ filteredProducts().length }} products</small>
        </div>

        <!-- Products Grid -->
        <div class="rh-shop-products" [class.rh-shop-products-list]="viewMode() === 'list'" *ngIf="filteredProducts().length; else emptyResults">
          <app-product-card
            *ngFor="let product of filteredProducts()"
            [product]="product"
            [viewMode]="viewMode()"
            [showSectionLabel]="false">
          </app-product-card>
        </div>

        <ng-template #emptyResults>
          <app-empty-state
            title="No products found"
            description="Try adjusting your filters or selecting another category."
            iconClass="fal fa-search"
            actionText="Clear filters"
            (actionClicked)="resetFilters()">
          </app-empty-state>
        </ng-template>
      </main>
    </div>
  </div>
</section>

<!-- Quick View Modal Component -->
<app-product-quick-view [product]="selectedQuickViewProduct()" (close)="closeQuickView()"></app-product-quick-view>
