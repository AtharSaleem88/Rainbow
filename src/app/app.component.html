<!-- Header Bar -->
<app-header *ngIf="showStorefrontChrome()"></app-header>

<!-- Main Page Router Content -->
<main class="main-content" [class.auth-layout]="!showStorefrontChrome()">
  <div *ngIf="showPageBack()" class="rainbow-page-breadcrumb"><div class="container maxw_1460"><app-breadcrumbs [items]="pageBreadcrumbs()"></app-breadcrumbs></div></div>
  <router-outlet></router-outlet>
</main>

<!-- Cart Sidebar Drawer -->
<app-cart-drawer *ngIf="showStorefrontChrome()"></app-cart-drawer>

<!-- Alternate Products Modal -->
<app-alternate-product-modal></app-alternate-product-modal>

<app-toast></app-toast>
<app-alert-dialog></app-alert-dialog>

<!-- Footer Bar -->
<app-footer *ngIf="showStorefrontChrome()"></app-footer>
